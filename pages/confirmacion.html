<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Confirmación de cuenta - Cero Huella"
    >

    <title>Cuenta confirmada | Cero Huella</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- CSS específico de confirmación -->
    <link rel="stylesheet" href="../css/pages/confirmacion.css">
</head>

<body>

    <!-- ============================================================
         CONTENIDO PRINCIPAL
         ============================================================ -->

    <main class="confirmacion-container">

        <section class="confirmacion-card">

            <!-- Icono de confirmación -->
            <div class="confirmacion-icono" aria-hidden="true">
                ✓
            </div>

            <!-- Título -->
            <h1>¡Cuenta confirmada!</h1>

            <!-- Mensaje principal -->
            <p>
                Tu dirección de correo electrónico fue confirmada
                correctamente.
            </p>

            <p>
                Ya podés iniciar sesión y comenzar a disfrutar
                de <strong>Cero Huella</strong>.
            </p>

            <!-- Acción principal -->
            <a
                href="./login.html"
                class="btn-confirmacion"
            >
                Iniciar sesión
            </a>

        </section>

    </main>

</body>

</html>
