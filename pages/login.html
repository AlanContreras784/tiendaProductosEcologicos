<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Estilos globales -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Estilos propios del login -->
    <link rel="stylesheet" href="../css/pages/login.css">
</head>

<body>
    <!-- NAVBAR -->
    <!-- ==================== HEADER ==================== -->
    <!-- ==================== HEADER ==================== -->
    <header id="header-principal" class="header">
        <!-- navbar.js renderiza el contenido -->
    </header>
    <main>
        <section class="auth-page">
            <article class="auth-card">
                <span class="auth-subtitle">
                    BIENVENIDO
                </span>
                <h2>
                    Iniciar sesión
                </h2>
                <form id="loginForm" novalidate>
                    <div class="campo-control">
                        <label for="username">
                            Usuario
                        </label>
                        <input type="text" id="username" placeholder="Ingrese usuario" required>
                        <small id="username-error" class="error-text">
                        </small>
                    </div>
                    <div class="campo-control">
                        <label for="password">
                            Contraseña
                        </label>
                        <input type="password" id="password" placeholder="Ingrese contraseña" required>
                        <small id="password-error" class="error-text">
                        </small>
                    </div>
                    <button type="submit" class="normal">
                        Iniciar sesión
                    </button>
                </form>
                <div class="auth-links">
                    <p>
                        ¿No tienes cuenta?
                        <a href="registro.html">
                            Registrate
                        </a>
                    </p>
                    <a href="../index.html">
                        Volver al inicio
                    </a>
                </div>
            </article>
        </section>
    </main>
    <!-- ==================== NEWSLETTER ==================== -->
    <section class="newsletter section-p1 section-m1">
        <div class="newstext">
            <h4>Suscribite al Newsletter</h4>
            <p>Recibí novedades de nuestra tienda y <span>ofertas exclusivas</span></p>
        </div>
        <div class="form">
            <input type="text" placeholder="Tu correo electrónico">
            <button>Suscribirme</button>
        </div>
    </section>

    <!-- FOOTER -->
    <footer id="footer-principal" class="section-p1">
        <!-- footer.js renderiza el contenido -->
    </footer>
    <!-- ====================TOAST ==================== -->
    <div id="toast" class="toast-custom">
        <span id="toastMensaje"></span>
        <button id="btnCerrarToast">✕</button>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast-custom">
        <span id="toastMensaje"></span>
        <button id="btnCerrarToast">
            ✕
        </button>
    </div>
    <script type="module" src="../script/components/navbar.js"></script>
    <script type="module" src="../script/components/footer.js"></script>
    <script type="module" src="../script/components/toast.js"></script>
    <script type="module" src="../script/pages/login.js"></script>
</body>

</html>
