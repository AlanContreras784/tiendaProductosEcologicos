<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Estilos globales -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components/newslleter.css">

    <!-- Estilos propios del login -->
    <link rel="stylesheet" href="../css/pages/login.css">

</head>

<body>

    <!-- ==================== HEADER ==================== -->
    <header id="header-principal" class="header">
        <!-- navbar.js renderiza el contenido -->
    </header>

    <main>

        <section class="auth-page">

            <article class="auth-card">

                <span class="auth-subtitle">
                    BIENVENIDO
                </span>

                <h2>
                    Iniciar sesión
                </h2>

                <!-- ==================== LOGIN TRADICIONAL ==================== -->

                <form id="loginForm" novalidate>

                    <div class="campo-control">

                        <label for="username">
                            Usuario
                        </label>

                        <input type="text" id="username" placeholder="Ingrese usuario" required>

                        <small id="username-error" class="error-text">
                        </small>

                    </div>

                    <div class="campo-control">

                        <label for="password">
                            Contraseña
                        </label>

                        <input type="password" id="password" placeholder="Ingrese contraseña" required>

                        <small id="password-error" class="error-text">
                        </small>

                    </div>

                    <button type="submit" class="normal">
                        Iniciar sesión
                    </button>

                </form>

                <!-- ==================== SEPARADOR ==================== -->

                <div class="login-separator">
                    <span>o</span>
                </div>

                <!-- ==================== LOGIN GOOGLE ==================== -->

                <button type="button" id="btnGoogle" class="btn-google">

                    <svg class="google-logo" viewBox="0 0 24 24" aria-hidden="true">

                        <path fill="#4285F4"
                            d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.22a4.46 4.46 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.93-4.18 2.93-7.4z" />

                        <path fill="#34A853"
                            d="M12 21.99c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.93-3.31.93-2.54 0-4.7-1.72-5.47-4.04H3.29v2.52A9.74 9.74 0 0 0 12 21.99z" />

                        <path fill="#FBBC05"
                            d="M6.53 14.08a5.86 5.86 0 0 1 0-3.75V7.81H3.29a9.99 9.99 0 0 0 0 8.79l3.24-2.52z" />

                        <path fill="#EA4335"
                            d="M12 6.29c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.39 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.71 5.31l3.24 2.52C7.3 8.01 9.46 6.29 12 6.29z" />

                    </svg>

                    <span>Continuar con Google</span>

                </button>

                <!-- ==================== LINKS ==================== -->

                <div class="auth-links">

                    <p>
                        ¿No tienes cuenta?

                        <a href="registro.html">
                            Registrate
                        </a>
                    </p>

                    <a href="../index.html">
                        Volver al inicio
                    </a>

                </div>

            </article>

        </section>

    </main>

    <!-- ==================== NEWSLETTER ==================== -->

    <section class="newsletter section-p1 section-m1">

        <div class="newstext">

            <h4>
                Suscribite al Newsletter
            </h4>

            <p>
                Recibí novedades de nuestra tienda y
                <span>ofertas exclusivas</span>
            </p>

        </div>

        <div class="form">

            <input type="text" placeholder="Tu correo electrónico">

            <button>
                Suscribirme
            </button>

        </div>

    </section>

    <!-- ==================== FOOTER ==================== -->

    <footer id="footer-principal" class="section-p1">

        <!-- footer.js renderiza el contenido -->

    </footer>

    <!-- ==================== TOAST ==================== -->

    <div id="toast" class="toast-custom">

        <span id="toastMensaje"></span>

        <button id="btnCerrarToast">
            ✕
        </button>

    </div>

    <!-- ==================== SCRIPTS ==================== -->

    <script type="module" src="../script/components/navbar.js">
    </script>

    <script type="module" src="../script/components/footer.js">
    </script>

    <script type="module" src="../script/components/toast.js">
    </script>

    <script type="module" src="../script/pages/login.js">
    </script>

</body>

</html>
