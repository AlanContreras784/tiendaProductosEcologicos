<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card">

                <div class="card-header text-center">
                    <h3>Crear usuario</h3>
                </div>


                <div class="card-body">

                    <form id="registroForm">


                        <div class="mb-3">
                            <label>Nombre</label>
                            <input
                                type="text"
                                id="nombre"
                                class="form-control"
                                required>
                        </div>


                        <div class="mb-3">
                            <label>Apellido</label>
                            <input
                                type="text"
                                id="apellido"
                                class="form-control"
                                required>
                        </div>


                        <div class="mb-3">
                            <label>Usuario</label>
                            <input
                                type="text"
                                id="username"
                                class="form-control"
                                required>
                        </div>


                        <div class="mb-3">
                            <label>Contraseña</label>
                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                required>
                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Registrarse
                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
