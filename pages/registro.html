<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Registro</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link
        rel="stylesheet"
        href="../css/style.css">


    <link
        rel="stylesheet"
        href="../css/components/newslleter.css">
</head>

<body class="bg-light">

    <!-- ==================== HEADER ==================== -->

    <header
        id="header-principal"
        class="header">
        <!-- navbar.js renderiza el contenido -->
    </header>


    <!-- ==================== REGISTRO ==================== -->

    <main>

        <div class="auth-container">

            <section class="auth-page">

                <article class="auth-card">

                    <h3>
                        Crear cuenta
                    </h3>


                    <form
                        id="registroForm"
                        novalidate>


                        <!-- ==================== USUARIO ==================== -->

                        <div class="campo-control">

                            <label for="username">
                                Usuario
                            </label>

                            <input
                                type="text"
                                id="username"
                                autocomplete="username"
                                required>

                            <small
                                id="username-error"
                                class="error-text">
                            </small>

                        </div>


                        <!-- ==================== NOMBRE ==================== -->

                        <div class="campo-control">

                            <label for="nombre">
                                Nombre
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                autocomplete="given-name"
                                required>

                            <small
                                id="nombre-error"
                                class="error-text">
                            </small>

                        </div>


                        <!-- ==================== APELLIDO ==================== -->

                        <div class="campo-control">

                            <label for="apellido">
                                Apellido
                            </label>

                            <input
                                type="text"
                                id="apellido"
                                autocomplete="family-name"
                                required>

                            <small
                                id="apellido-error"
                                class="error-text">
                            </small>

                        </div>


                        <!-- ==================== EMAIL ==================== -->

                        <div class="campo-control">

                            <label for="email">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="email"
                                autocomplete="email"
                                required>

                            <small
                                id="email-error"
                                class="error-text">
                            </small>

                        </div>


                        <!-- ==================== CONTRASEÑA ==================== -->

                        <div class="campo-control">

                            <label for="password">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                id="password"
                                autocomplete="new-password"
                                required>

                            <small
                                id="password-error"
                                class="error-text">
                            </small>

                        </div>


                        <!-- ==================== BOTÓN ==================== -->

                        <button
                            type="submit"
                            class="btn-auth">
                            Registrarse
                        </button>

                    </form>


                    <!-- ==================== LOGIN ==================== -->

                    <div class="auth-link">

                        <a href="login.html">
                            ¿Ya tienes cuenta? Iniciar sesión
                        </a>

                    </div>


                    <!-- ==================== INICIO ==================== -->

                    <div class="auth-link">

                        <a href="../index.html">
                            Volver al inicio
                        </a>

                    </div>


                    <!-- ==================== TOAST ==================== -->

                    <div
                        id="toast"
                        class="toast-custom">

                        <span id="toastMensaje"></span>

                        <button
                            id="btnCerrarToast">
                            ✕
                        </button>

                    </div>

                </article>

            </section>

        </div>

    </main>


    <!-- ==================== NEWSLETTER ==================== -->

    <section
        class="newsletter section-p1 section-m1">

        <div class="newstext">

            <h4>
                Suscribite al Newsletter
            </h4>

            <p>
                Recibí novedades de nuestra tienda y
                <span>ofertas exclusivas</span>
            </p>

        </div>


        <div class="form">

            <input
                type="text"
                placeholder="Tu correo electrónico">

            <button>
                Suscribirme
            </button>

        </div>

    </section>


    <!-- ==================== FOOTER ==================== -->

    <footer
        id="footer-principal"
        class="section-p1">
        <!-- footer.js renderiza contenido -->
    </footer>


    <!-- ==================== SCRIPTS ==================== -->

    <script
        type="module"
        src="../script/components/navbar.js">
    </script>

    <script
        type="module"
        src="../script/components/footer.js">
    </script>

    <script
        type="module"
        src="../script/components/toast.js">
    </script>

    <script
        type="module"
        src="../script/pages/registro.js">
    </script>

</body>

</html>
