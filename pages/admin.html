<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Productos Ecológicos</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../estilos/admin.css">
</head>

<body>

    <!-- ==================== HEADER ==================== -->
    <header id="header-principal" class="header">
        <!-- navbar.js renderiza el contenido -->
    </header>

    <main class="admin-main">

        <h2>Panel de Administración</h2>
        <p class="admin-subtitulo">Gestioná los productos de la tienda: crear, editar y eliminar.</p>

        <!-- ==================== FORMULARIO ==================== -->
        <section class="admin-form-section">
            <h3 id="formTitulo">Nuevo producto</h3>

            <form id="formProducto" class="admin-form">
                <input type="hidden" id="productoId">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="campo">
                    <label for="precio">Precio</label>
                    <input type="number" id="precio" min="0" step="0.01" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" required></select>
                </div>

                <div class="campo campo-full">
                    <label for="imagenUrl">URL de imagen</label>
                    <input type="text" id="imagenUrl" placeholder="https://..." required>
                </div>

                <div class="campo campo-full">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" rows="3" required></textarea>
                </div>

                <div class="campo-acciones">
                    <button type="submit" id="btnGuardar" class="btn-primario">Crear producto</button>
                    <button type="button" id="btnCancelarEdicion" class="btn-secundario" style="display:none;">
                        Cancelar edición
                    </button>
                </div>
            </form>
        </section>

        <!-- ==================== TABLA DE PRODUCTOS ==================== -->
        <section class="admin-tabla-section">
            <h3>Productos existentes</h3>
            <div class="admin-tabla-wrapper">
                <table class="admin-tabla">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos">
                        <tr>
                            <td colspan="5" class="admin-cargando">Cargando productos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <!-- ==================== FOOTER ==================== -->
        <!-- Mismo footer que en index.html -->
         <footer id="footer-principal" class="section-p1">
        <!-- footer.js renderiza el contenido -->
        </footer>

        <!-- TOAST -->
        <div id="toast" class="toast-custom">
            <span id="toastMensaje"></span>
            <button id="btnCerrarToast">✕</button>
        </div>

    </main>

    <!-- toast.js es un script clásico (no módulo): tiene que cargar
         ANTES que admin.js para que mostrarToast ya exista -->
         <script type="module" src="../script/components/navbar.js"></script>
         <script type="module" src="../script/components/footer.js"></script>
         <script type="module" src="../script/pages/admin.js"></script>
         <script type="module" src="../script/components/toast.js"></script>
</body>

</html>
