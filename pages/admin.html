<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Productos Ecológicos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages/admin.css">
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header id="header-principal" class="header">
        <!-- navbar.js renderiza el contenido -->
    </header>
    <main class="admin-main">

        <h2>Centro de Administración</h2>
        <p class="admin-subtitulo">Administrá productos, categorías y usuarios desde un único lugar..</p>
        <!-- ==================== DASHBOARD ==================== -->
        <section class="admin-dashboard">
            <!-- PRODUCTOS -->
            <article id="cardProductos" class="admin-card admin-card-clickable" role="button" tabindex="0">
                <h4>Productos</h4>
                <span id="totalProductos"> 0 </span>
            </article>
            <!-- CATEGORÍAS -->
            <article id="cardCategorias" class="admin-card admin-card-clickable" role="button" tabindex="0">
                <h4>Categorías</h4>
                <span id="totalCategorias"> 0 </span>
            </article>
            <!-- USUARIOS -->
            <article id="cardUsuarios" class="admin-card admin-card-clickable" role="button" tabindex="0">
                <h4>Usuarios</h4>
                <span id="totalUsuarios"> 0 </span>
            </article>
        </section>
    <!-- ======================================================
        CONTENIDO DINÁMICO DEL ADMIN
        Aquí se cargan los módulos:
        - Productos
        - Categorías
        - Usuarios
        Cada módulo se importa dinámicamente cuando el
        administrador selecciona una tarjeta del dashboard.
    ====================================================== -->
        <section id="adminContenido" class="admin-contenido">
            <div class="admin-contenido-vacio">
                <h3>
                    Seleccioná una sección
                </h3>
                <p>
                    Elegí Productos, Categorías o Usuarios
                    desde el dashboard.
                </p>
            </div>
        </section>
        <!-- ======================================================
            MODAL DE CONFIRMACIÓN
            Se reutiliza para acciones importantes del panel admin.
        ====================================================== -->
        <aside id="modal-confirm" class="modal-confirm hidden" aria-hidden="true">
            <section class="modal-confirm-content" role="dialog" aria-modal="true" aria-labelledby="modal-message">
                <p id="modal-message">
                    ¿Confirmar acción?
                </p>
                <div class="modal-actions">
                    <button id="modal-no" type="button" class="btn-cancel">
                        Cancelar
                    </button>
                    <button id="modal-yes" type="button" class="btn-ok">
                        Aceptar
                    </button>
                </div>
            </section>
        </aside>
        <!-- ==================== FOOTER ==================== -->
        <!-- Mismo footer que en index.html -->
        <footer id="footer-principal" class="section-p1">
            <!-- footer.js renderiza el contenido -->
        </footer>
        <!-- ==================== SPINNER ==================== -->
        <div id="spinner" class="spinner-overlay" style="display:none;">
            <div class="spinner"></div>
        </div>
        <!-- ==================== TOAST ==================== -->
        <div id="toast" class="toast-custom">
            <span id="toastMensaje"></span>
            <button id="btnCerrarToast">✕</button>
        </div>
    </main>

    <!-- toast.js es un script clásico (no módulo): tiene que cargar
         ANTES que admin.js para que mostrarToast ya exista -->
    <script type="module" src="../script/components/navbar.js"></script>
    <script type="module" src="../script/components/footer.js"></script>
    <script type="module" src="../script/components/modalConfirmacion.js"></script>
    <script type="module" src="../script/components/toast.js"></script>
    <script type="module" src="../script/components/spinner.js"></script>
    <script type="module" src="../script/pages/admin.js"></script>
</body>

</html>
