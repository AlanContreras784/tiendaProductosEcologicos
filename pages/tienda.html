<!-- ==================== FILTROS ==================== -->
<section class="filtros-productos section-p1">

        type="search"
        placeholder="Buscar productos...">
    <select id="filtroCategoria">
        <option value="">
            Todas las categorías
        </option>
    </select>
</section>
<!-- ==================== PRODUCTOS ==================== -->
<section 
    class="section-productos section-p1">
    <div 
        id="listaProductos"
        class="productos-container">
        <!-- Aquí se cargan los productos desde JS -->
    </div>
</section>
<!-- ==================== PAGINADOR ==================== -->
<div 
    id="paginador"
    class="pagination-container">
</div>

<!-- ======================================================
     MODAL DETALLE PRODUCTO
     Se reutiliza para mostrar la información completa
     de cualquier producto.
====================================================== -->
<aside
    id="overlayModal"
    class="modal-overlay"
    aria-hidden="true">
    <section
        class="modal-producto"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitulo">
        <button
            id="btnCerrarModal"
            class="modal-cerrar"
            aria-label="Cerrar">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <figure class="modal-imagen">
            <img
                id="modalImagen"
                src=""
                alt="">
        </figure>
        <section class="modal-info">
            <header>
                <span id="modalCategoria"></span>
                <h2 id="modalTitulo"></h2>
            </header>
            <article>
                <p id="modalDescripcion"></p>
                <p class="modal-stock">
                    Stock:
                    <strong id="modalStock"></strong>
                </p>
            </article>
            <footer>
                <h3 id="modalPrecio"></h3>
                <button
                    id="modalAgregar"
                    class="carrito">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Agregar al carrito
                </button>
            </footer>
        </section>
    </section>
</aside>


<!-- ==================== TOAST ==================== -->
<div 
    id="toast"
    class="toast-custom">
    <span id="toastMensaje"></span>
    <button 
        id="btnCerrarToast">
        ✕
    </button>
</div>
